<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator for basic arithmetic operations">
    <meta property="og:title" content="Calculator" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://cdn.pixabay.com/photo/2023/03/06/04/26/calculator-7832583_1280.png" />
    <meta property="og:url" content="https://www.freecodecamp.org" />
    <link href="./styles/calculator.css" rel="stylesheet">
    <title>Calculator</title>
</head>
<body>
    <div id="container">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('+')" class="operator-button">+</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="operator-button">-</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="operator-button">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('/')" class="operator-button">/</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="clearDisplay()" class="operator-button">C</button>
        </div>
    </div>
    
    <script src="./scripts/calculator.js"></script>
</body>
</html>
