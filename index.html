<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator for basic arithmetic, decimals, pi, and previous answers.">
    <meta name="theme-color" content="#262626">
    <link rel="canonical" href="https://abdaltwabsayed.github.io/Calculator/">
    <meta property="og:title" content="Calculator | Abdaltwab Sayed">
    <meta property="og:description" content="A simple calculator for basic arithmetic, decimals, pi, and previous answers.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://abdaltwabsayed.github.io/Calculator/">
    <meta property="og:image" content="https://abdaltwabsayed.github.io/Calculator/assets/icon.png">
    <meta property="og:image:alt" content="Calculator app icon">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Calculator | Abdaltwab Sayed">
    <meta name="twitter:description" content="A simple calculator for basic arithmetic, decimals, pi, and previous answers.">
    <meta name="twitter:image" content="https://abdaltwabsayed.github.io/Calculator/assets/icon.png">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link href="./styles/calculator.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Calculator | Abdaltwab Sayed</title>
</head>
<body>
    <div id="container">
        <textarea id="display" aria-label="Calculator display" aria-live="polite" readonly autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" autoFocus></textarea>
        <div id="keys" role="group" aria-label="Calculator keys">
            <!-- First row -->
            <button id="seven" type="button" class="number-button" data-value="7">7</button>
            <button id="eight" type="button" class="number-button" data-value="8">8</button>
            <button id="nine" type="button" class="number-button" data-value="9">9</button>
            <button id="delete" type="button" class="operator-button" data-action="delete" aria-label="Delete">DEL</button>
            <button type="button" class="operator-button" data-action="clear" aria-label="All clear">AC</button>
            <!-- Second row -->
            <button id="four" type="button" class="number-button" data-value="4">4</button>
            <button id="five" type="button" class="number-button" data-value="5">5</button>
            <button id="six" type="button" class="number-button" data-value="6">6</button>
            <button id="multiply" type="button" class="operator-button" data-value="×" aria-label="Multiply">×</button>
            <button id="divide" type="button" class="operator-button" data-value="÷" aria-label="Divide">÷</button>
            <!-- Third row -->
            <button id="one" type="button" class="number-button" data-value="1">1</button>
            <button id="two" type="button" class="number-button" data-value="2">2</button>
            <button id="three" type="button" class="number-button" data-value="3">3</button>
            <button id="add" type="button" class="operator-button" data-value="+">+</button>
            <button id="subtract" type="button" class="operator-button" data-value="-">-</button>
            <!-- Fourth row -->
            <button id="zero" type="button" class="number-button" data-value="0">0</button>
            <button id="decimal" type="button" class="number-button" data-value=".">.</button>
            <button id="PI" type="button" class="number-button" data-value="π" aria-label="Pi">π</button>
            <button id="previous" type="button" class="number-button" data-value="Ans" aria-label="Previous answer">Ans</button>
            <button id="calc" type="button" class="operator-button" data-action="calculate" aria-label="Equals">=</button>
        </div>
    </div>
    
    <script src="./scripts/calculator.js"></script>
</body>
</html>
