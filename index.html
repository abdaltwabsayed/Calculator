<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple calculator for basic arithmetic operations">
    <meta property="og:title" content="Calculator" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://cdn.pixabay.com/photo/2023/03/06/04/26/calculator-7832583_1280.png" />
    <meta property="og:url" content="https://www.freecodecamp.org" />
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link href="./styles/calculator.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playwrite+BR+Guides&family=Press+Start+2P&family=Rakkas&display=swap" rel="stylesheet">
    <title>Calculator</title>
</head>
<body>
    <div id="container">
        <textarea id="display" readonly autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" autoFocus ></textarea>
        <div id="keys" onsubmit="calculate()">
            <!-- First row -->
            <div id="seven" class="number-button">7</div>
            <div id="eight" class="number-button">8</div>
            <div id="nine" class="number-button">9</div>
            <div id="delete" class="operator-button">DEL</div>
            <div class="operator-button">AC</div>
            <!-- Second row -->
            <div id="four" class="number-button">4</div>
            <div id="five" class="number-button">5</div>
            <div id="six" class="number-button">6</div>
            <div id="multiply" class="operator-button">×</div>
            <div id="divide" class="operator-button">÷</div>
            <!-- Third row -->
            <div id="one" class="number-button">1</div>
            <div id="two" class="number-button">2</div>
            <div id="three" class="number-button">3</div>
            <div id="add" class="operator-button">+</div>
            <div id="subtract" class="operator-button">-</div>
            <!-- Fourth row -->
            <div id="zero" class="number-button">0</div>
            <div id="decimal" class="number-button">.</div>
            <div id="PI" class="number-button">π</div>
            <div id="previous" class="number-button">Ans</div>
            <div id="calc" class="operator-button">=</div>
        </div>
    </div>
    
    <script src="./scripts/calculator.js"></script>
</body>
</html>
